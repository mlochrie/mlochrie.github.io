name: Update Lab Index

on:
  push:
    paths:
      - 'CO2404/26-27/labs/*.html'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate index.html
        run: |
          cat > CO2404/26-27/labs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>CO2404 Labs</title>
          </head>
          <body>
              <h1>CO2404 Labs</h1>
              <ul>
          EOF

          for file in CO2404/26-27/labs/*.html
          do
            name=$(basename "$file")

            # Skip the generated index itself
            if [ "$name" = "index.html" ]; then
              continue
            fi

            title=$(basename "$file" .html | sed 's/_/ /g')

            echo "<li><a href=\"$name</a></li>" \
              >> CO2404/26-27/labs/index.html
          done

          cat >> CO2404/26-27/labs/index.html << 'EOF'
              </ul>
          </body>
          </html>
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add CO2404
