<body class='typora-export os-windows'><div class='typora-export-content'>
<div id='write'  class=''><p><span class='md-image'><img  align="right" src="https://github.com/UCLanCSC/CSResources/blob/main/images/general/logo.png?raw=true" style="zoom:50%" /></span></p><h1 id='co2404-cross-platform-development'><span>CO2404: Cross-Platform Development </span></h1><h2 id='scheme-of-learning'><span>Scheme of Learning</span></h2><p><strong><span>Module Leader:</span></strong><span> Dr. Mark Lochrie (</span><a href='mailto:MLochrie@lancashire.ac.uk'><span>MLochrie@lancashire.ac.uk</span></a><span>)</span></p><figure class='table-figure'><table><thead><tr><th><strong><span>Module Title</span></strong></th><th><span>Cross-Platform Development</span></th><th>&nbsp;</th><th>&nbsp;</th><th>&nbsp;</th><th>&nbsp;</th></tr></thead><tbody><tr><td><strong><span>Module Code</span></strong></td><td><span>CO2404</span></td><td><strong><span>Weeks</span></strong></td><td><span>19</span></td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><strong><span>Course(s)</span></strong></td><td><span>Software Engineering (C), </span><br /><span>Computing (O Y3), </span><br /><span>Computer Science (O Y3), </span><br /><span>Computer Games Development (O Y3)</span></td><td><strong><span>Credits</span></strong></td><td><span>20</span></td><td><strong><span>Delivery</span></strong></td><td><span>Year long</span></td></tr><tr><td><strong><span>Assessment Deadlines </span></strong></td><td><strong><span>CWK1</span></strong><span>: 09.00 19/03/2027</span><br /><strong><span>EXM1</span></strong><span>: XX/XX/2026 - XX/XX/2027</span></td><td><strong><span>Level</span></strong></td><td><span>5</span></td><td><strong><span>Contact Hours</span></strong></td><td><span>50</span></td></tr></tbody></table></figure><p>&nbsp;</p><figure class='table-figure'><table><thead><tr><th><span>Week</span></th><th><span>Date w/c</span></th><th><span>Learning Activity</span></th><th><span>Curriculum/Content</span></th><th><span>Key topics</span></th><th><span>Teaching Strategy</span></th><th><span>LOs</span></th></tr></thead><tbody><tr><td><strong><span>Semester:</span></strong></td><td><strong><span>1</span></strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><span>1</span></td><td><span>02/10</span></td><td><strong><span>Lecture:</span></strong><span> Introduction</span></td><td><span>Teaching delivery, background into the module. </span><br /><span>Understand the module&#39;s aims, learning outcomes, assessment strategy, and curriculum breakdown.</span></td><td><span>Introduction, background to the module delivery and assessment.</span></td><td><span>Lecture, discussions, and hands-on exercises.</span></td><td><span>5</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Coursework debrief</span></td><td><span>Familiarity with the coursework brief</span></td><td><span>Coursework</span></td><td><span>Seminar discussion</span></td><td><span>1-4</span></td></tr><tr><td><span>2</span></td><td><span>09/10</span></td><td><strong><span>Lecture:</span></strong><span> Cross-platform Development, Development Environment</span></td><td><span>Compare iOS/Android development environments</span><br /><span>Understand modern application practices.</span><br/><span>Explore the Android development ecosystem.</span><br/><span>Learn why Flutter is adopted for this module.</span><br/><span>Familiarise with the Software Development Kit (SDK) for building Android applications using Flutter.</span><br/><span>Use Visual Studio Code (VSC) for programming.</span></td><td><span>Development Frameworks, SDK, Development Environment, Ecosystems.</span></td><td><span>Lecture, hands-on exercises, demonstrations, and discussions of development tools and practices.</span></td><td><span>5</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span>  Development Environment Setup</span></td><td><span>Checking out all aspects of the modern development environment is set up (SDKs, Emulator, IDE, Plugins)</span></td><td><span>Development environment, Hello World &gt; Counter App</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>3</span></td><td><span>16/10</span></td><td><strong><span>Lecture:</span></strong><span> Dart OOP</span></td><td><span>Introduction to OOP in Dart, recap on classes and an initial introduction to inheritance </span></td><td><span>Dart OOP, introduction and recap</span></td><td><span>Lecture, demonstrations</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> </span></td><td><span>Familiarity of performing OOP in Dart, after the lab students will be able to create and use classes within their applications and begin to understanding the importance of inheritance within Flutter</span></td><td><span>Development environment, Dart OOP</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>4</span></td><td><span>23/10</span></td><td><strong><span>Lecture: </span></strong><span>UI Widgets</span></td><td><span>Understand how Flutter apps are built structurally and presentation-wise (MVP) Introduction into Widget trees, and how applications are built. Differentiate between stateless and stateful widgets.</span></td><td><span>Widget, trees, Stateful and Stateless Widgets, User Interface (positioning, layout, structure)</span></td><td><span>Lecture, hands-on exercises (creating Flutter UIs, focusing on layouts, input, and value widgets).</span></td><td><span>1, 2</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Learning UI</span></td><td><span>Exposure to the process of building a Flutter app using the Visual Studio Code environment. Introduce the building blocks of Flutter development. Provide a basic understanding of how Widgets work to build Flutter interfaces</span></td><td><span>Programming Widgets, Basic structure, Scaffold, Container</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1, 2</span></td></tr><tr><td><strong><span>Half term</span></strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><span>5</span></td><td><span>06/11</span></td><td><strong><span>Lecture:</span></strong><span> UI Widgets Pt2</span></td><td><span>Identify and describe different types of UI layouts. Understand the use cases and design principles behind lists, grids, and tables. Evaluate the strengths and limitations of each layout type. Apply layout structures in designing user interfaces for web and mobile applications.</span></td><td><span>ListView, CardView, TableView, GridView</span></td><td><span>Lecture, practical exercises</span></td><td><span>1, 2</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong></td><td><span>In this lab, you’ve learned how to implement a List of items using the ListView.builder method. The application you build takes user input and adds this input into a dynamic list. The skills is advanced with the use of a map to transform the user input to ensure consistency across user input.</span></td><td><span>ListView .map</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1, 2</span></td></tr><tr><td><span>6</span></td><td><span>13/11</span></td><td><strong><span>Lecture:</span></strong><span> Navigation</span></td><td><span>Develop interactive widgets using button tap handling. Design for navigation with various navigational widgets. Understand widget structure and positioning for effective mobile applications.</span></td><td><span>Positioning, Navigation: Stacks, Drawer, Tabs and Dialogs, routes.</span></td><td><span>Lecture, practical exercises and discussions comparing stateless and stateful widgets.</span></td><td><span>1, 2</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong></td><td><span>Synthesising the knowledge to date by building a mini application that relies on understanding Stateless and Stateful Widgets with navigational routing.</span></td><td><span>Navigation, Routing</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1, 2</span></td></tr><tr><td><span>7</span></td><td><span>20/11</span></td><td><strong><span>Lecture:</span></strong><span> Styling</span></td><td><span>Understand the uses of State and Stateless Widgets. Build interfaces with various types of widgets. Style widgets for improved usability and presentation.</span></td><td><span>Stateful Widget Lifecycles (recap), ListView, GridView, MediaQuery, Responsive, Theme Class.</span></td><td><span>Lecture, focussing on styling techniques and best practices for Flutter apps, formative assessment.</span></td><td><span>1, 2</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong></td><td><span>Building User Interfaces. Provide practical knowledge of various Widgets to present information to users. Breakdown the understanding of styling mobile applications in efficient and effective ways</span></td><td><span>Styling, Themes</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1, 2</span></td></tr><tr><td><span>8</span></td><td><span>27/11</span></td><td><strong><span>Lecture:</span></strong><span> Testing</span></td><td><span>Differentiate between debugging and testing code. Prepare test cases to ensure code performance. Use debugging statements to solve programming issues.</span></td><td><span>Unit test and Widget test, Debugging, DevTools, Breakpoints, Logs,</span></td><td><span>Lecture, introduce testing methodologies and tools. Provide opportunities for students to practice writing and running tests.</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Unit and Widget Testing</span></td><td><span>Exposure to the process testing and debugging Flutter apps. Introduce functions for creating Unit and Widget tests. Provide a basic understanding using DevTools in your development process.</span></td><td><span>Unit Test, Widget Test, Debugging</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>9</span></td><td><span>04/12</span></td><td><strong><span>Lecture:</span></strong><span> Design</span></td><td><span>Understand what design is and how it plays an important role in application development Become aware of the interaction modalities afforded to building software for mobile devices Familiarise yourself with User Interface design and principles to follow in order to design more usable, accessible and effective interfaces Learn the basics of heuristics to evaluate the effectiveness of the application/software.</span></td><td><span>Understanding users, good/bad design, heuristics, design principles, gulfs, interaction modalities.</span></td><td><span>Lecture, discussion, and case studies.</span></td><td><span>2, 3, 4</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong></td><td><span>Introduce design as a process to students, to provide practical knowledge of how to design for mobile. Underpin and evidence visions with standards commonly used in mobile interface design. Provide the necessary skills needed to contribute towards the practical and theoretical components of this module in the coursework and exam assessments</span></td><td><span>Design Principles, Heuristics, Referencing, Wireframe</span></td><td><span>Lab, project-based learning</span></td><td><span>2, 3, 4</span></td></tr><tr><td><span>10</span></td><td><span>11/12</span></td><td><strong><span>Lecture:</span></strong><span> Coursework support</span></td><td><span>Recap key aspects of S1</span></td><td><span>Coursework</span></td><td><span>Lecture, discussion</span></td><td><span>1-4</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Coursework Support</span></td><td><span>Encourage students to start the coursework and provide pace notes with the previous weeks knowledge and how they relates to the coursework and maps to the assessment criteria</span></td><td><span>Coursework</span></td><td><span>Studio lab</span></td><td><span>1-4</span></td></tr><tr><td><strong><span>Semester:</span></strong></td><td><strong><span>2</span></strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><span>11</span></td><td><span>22/01</span></td><td><strong><span>Lecture:</span></strong><span> Asynchronous Programming</span></td><td><span>Become aware of asynchronous programming in Flutter</span><br/><span>Understand the various elements to asynchronous programming in Dart</span><br/><span>Build on previous knowledge about Stateful Widgets with asynchronous programming</span></td><td><span>Asynchronous programming, Isolates, Event-loops, Futures, FutureBuilder, Await/Async and Streams.</span></td><td><span>Lectures, Lecture, code examples, exercises to reviewing how asynchronous programming is achieved in Flutter.</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Building Asynchronously</span></td><td><span>Build up the learning of writing asynchronous programs in Flutter.</span><br /><span>Reflect on the various approaches to writing asynchronous applications.</span></td><td><span>Async/Await, Future, FutureBuilder,</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>12</span></td><td><span>29/01</span></td><td><strong><span>Lecture:</span></strong><span> Parsing Data</span></td><td><span>Understand the basics of networking in Cross-platform applications. </span><br /><span>Develop an application that connects to an endpoint and receives data ready for parsing.</span><br /><span>Understand how to parse JSON data and present the result in a List Widget using a Data Model.</span></td><td><span>Parsing, Presenting data, error handling,</span></td><td><span>Lecture, code examples, and exercises to reinforce how this topic brings together the understanding of the assessment for mid-high marking criteria.</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Building with APIs</span></td><td><span>Build on previous lab activities by introducing how Flutter applications communicate with the Internet.</span><br /><span>Experiment with debugging API calls Integrate API calls and handling data in Flutter asynchronous applications</span></td><td><span>Data, API</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>13</span></td><td><span>05/02</span></td><td><strong><span>Lecture:</span></strong><span> Local Storage</span></td><td><span>Understand how to interact and handle data in mobile application workflows</span><br/><span>Gain insights into the various methods for handling data on mobile</span><br/><span>Appreciate the importance of data handling in modern </span><br/><span>Build up knowledge of writing mobile applications with a SharedPreferences and SQLite database for storing data.</span></td><td><span>Data interaction, local storage: SQLite, writing to file, shared preferences (key/value pairs), data models, database helpers.</span></td><td><span>Lecture, code examples, demonstrations, and exercises.</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Building with Local Data Interaction</span></td><td><span>Experiment with two types of data interaction with SharePreferences and SQFLite. </span><br /><span>Integrate data interaction into a cross-platform application.</span></td><td><span>Local storage, data handling, parsing</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><span>14</span></td><td><span>12/02</span></td><td><strong><span>Lecture:</span></strong><span> Cloud Storage</span></td><td><span>Understand the difference between local and server storage by focusing on examples of using the cloud to store data</span><br/><span>Appreciate the differences between SQL and NoSQL database types</span><br/><span>Gain insights into a method for storing data in the cloud</span><br/><span>Appreciate how both local and server storage is used interchangeably within mobile application development.</span><br/><span>Build up knowledge of writing mobile applications with storage, utilising Google’s Firebase</span><br/><span>Gain knowledge of building with Firebase Real Time Databases.</span></td><td><span>Server infrastructures, database infrastructures, MySQL, NoSQL, Firebase: Real time database, Firestore.</span></td><td><span>Lecture, code examples, demonstrations and exercises.</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Building with the Cloud</span></td><td><span>Experiment with two types of cloud storage.</span><br /><span>Use Firebase&#39;s Realtime database and Firestore</span></td><td><span>Cloud storage, data handling, parsing</span></td><td><span>Lab, demonstration, activity</span></td><td><span>1</span></td></tr><tr><td><strong><span>Half term</span></strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><span>15</span></td><td><span>26/02</span></td><td><strong><span>Lecture: </span></strong><span>Final checks</span></td><td><span>Understand how the coursework will be assessed with detailed grade banding explained, demonstrations of previous student work</span></td><td><span>Marking criteria</span></td><td><span>Lecture, grade banding examples</span></td><td><span>1</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Development Support</span></td><td><span>Coursework support</span></td><td><span>Coursework support</span></td><td><span>Studio lab</span></td><td><span>1-4</span></td></tr><tr><td><span>16 - 17</span></td><td><span>05/03</span></td><td><strong><span>Lecture:</span></strong><span> Coursework support</span></td><td><span>Recap key aspects of S2</span></td><td><span>Coursework</span></td><td><span>Lecture, discussion</span></td><td><span>1-4</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Coursework support</span></td><td><span>Coursework support /Exam revision guidance </span></td><td><span>Assessment support</span></td><td><span>Studio lab</span></td><td><span>1-4</span></td></tr><tr><td><span>18</span></td><td><span>19/03</span></td><td><strong><span>Lecture:</span></strong><span> Demonstration preparations</span></td><td><span>Demonstration preparation</span></td><td><span>Assessment marking</span></td><td>&nbsp;</td><td><span>1,2 3, 4</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> Demonstrations</span></td><td><span>Demonstrations</span></td><td><span>Assessment marking</span></td><td>&nbsp;</td><td><span>1,2 3, 4</span></td></tr><tr><td><strong><span>Easter</span></strong></td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td><span>19</span></td><td><span>16/03</span></td><td><strong><span>Lecture:</span></strong><span> Revision</span></td><td><span>Exam revision practice  </span></td><td><span>Assessment support</span></td><td><span>Lecture, discussion</span></td><td><span>1-5</span></td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td><strong><span>Lab:</span></strong><span> General feedback/forawrd</span></td><td><span>General coursework feedback/forward and exam practice</span></td><td><span>Coursework feedback and assessment support</span></td><td><span>Seminar, discussion</span></td><td><span>1-5</span></td></tr></tbody></table></figure><p>&nbsp;</p></div></div>
